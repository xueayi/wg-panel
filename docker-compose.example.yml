# wg-panel 部署示例
#
# 这里只放「面板自己」需要的东西：端口、数据卷、初始账号。
# 中转节点地址、SSH 凭证（密钥或密码）、接口名、隧道参数……全部在面板的
# 「连接设置」里填，不用回来改这个文件。
services:
  wg-panel:
    image: xueayis/wg-panel:latest
    container_name: wg-panel
    restart: unless-stopped
    ports:
      - "13010:8000"          # 面板端口，按需改
    volumes:
      - ./data:/data          # 面板数据：账号、连接设置、审计日志、上传的密钥
    environment:
      # 初始管理员密码：只在第一次启动时用于初始化（用户名 admin）。
      # 不填则默认 admin / admin，登录后请立刻在面板里改掉。
      WGP_ADMIN_PASSWORD: __ADMIN_PASSWORD__
      # 会话签名密钥，务必换成随机串：openssl rand -hex 32
      WGP_SECRET_KEY: __SECRET_KEY__
      # 可选：上线首日想先只读观察，就打开下面这行（之后也能在面板里切换）
      # WGP_READ_ONLY: "1"
