# 构建面板镜像并推送到 Docker Hub（xueayis/wg-panel）。
#
# 前置：仓库 Settings → Secrets and variables → Actions 配置
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token（Account Settings → Security）
#
# 触发：推送 v* tag（打版本标签 + latest）、手动 workflow_dispatch。
# 普通 push 到 main 不再触发构建。
#
# 执行范围：仅 GitHub 镜像仓库（github.com/xueayi/wg-panel）。
# 自建 Gitea 源仓库已在仓库设置中关闭 Actions；
# 下面的 job 级 if 条件作为第二层保护：即使 Gitea Actions 将来被重新启用，
# 构建任务也会因 github.server_url 不是 github.com 而跳过。
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    # 仅在 GitHub 上执行（Gitea 源仓库不执行自动化，见文件头说明）
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: xueayis/wg-panel
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
